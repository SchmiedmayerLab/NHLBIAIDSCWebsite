name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  availability:
    name: Detect Pages availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      visibility: ${{ steps.pages.outputs.visibility }}
    steps:
      - name: Check repository visibility and Pages configuration
        id: pages
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          visibility="$(gh api "repos/${REPOSITORY}" --jq '.visibility')"
          echo "visibility=${visibility}" >> "${GITHUB_OUTPUT}"

          response_file="${RUNNER_TEMP}/pages-response.json"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/pages")"

          case "${status}" in
            200)
              echo 'enabled=true' >> "${GITHUB_OUTPUT}"
              echo "::notice title=GitHub Pages available::Pages is configured for this ${visibility} repository."
              ;;
            404)
              echo 'enabled=false' >> "${GITHUB_OUTPUT}"
              echo "::notice title=GitHub Pages not configured::Deployment is intentionally skipped for this ${visibility} repository. Enable Pages with GitHub Actions to activate it."
              ;;
            *)
              echo "::error title=Unable to inspect GitHub Pages::The Pages API returned HTTP ${status}."
              exit 1
              ;;
          esac

  validation:
    name: Complete CI suite
    needs: availability
    if: ${{ github.ref == 'refs/heads/main' && needs.availability.outputs.enabled == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/check.yml

  build:
    name: Build deployment artifact
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the configured Pages origin and base path
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          PARTICIPATION_FORM_URL: ${{ vars.PARTICIPATION_FORM_URL }}
          CAREER_INTEREST_FORM_URL: ${{ vars.CAREER_INTEREST_FORM_URL }}
          CENTER_CONTACT_EMAIL: ${{ vars.CENTER_CONTACT_EMAIL }}
      - name: Audit deployment artifact
        run: npm run test:site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  no-deployment:
    name: Deployment intentionally skipped
    needs: availability
    if: ${{ github.ref != 'refs/heads/main' || needs.availability.outputs.enabled != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why no deployment was attempted
        env:
          PAGES_ENABLED: ${{ needs.availability.outputs.enabled }}
          REPOSITORY_VISIBILITY: ${{ needs.availability.outputs.visibility }}
        run: |
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "Deployment only runs from main; current ref is ${GITHUB_REF}."
          else
            echo "GitHub Pages is not configured for this ${REPOSITORY_VISIBILITY} repository."
            echo 'All ordinary CI checks still run through the CI workflow.'
            echo 'Enable Settings > Pages > GitHub Actions to activate deployment.'
          fi
