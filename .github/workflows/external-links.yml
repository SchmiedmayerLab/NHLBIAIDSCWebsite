name: External link audit

on:
  schedule:
    - cron: '43 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  links:
    name: Check external website and documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@v6
      - name: Build static site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Check website and documentation links with retry and cache
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir '${{ github.workspace }}/dist'
            './dist/**/*.html'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
